[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsa-polymarket-research"
version = "0.1.0"
description = "Auditable public-data TSA forecasting and paper research"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.5,<2", "streamlit>=1.40,<2", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tsa = "tsa_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
